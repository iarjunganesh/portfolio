name: CI

on:
  push:
  pull_request:
  # Weekly canary: the demo links on this site are load-bearing proof and can
  # die between pushes. Hugging Face Spaces sleep; Vercel projects get paused.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:links
